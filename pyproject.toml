[project]
name = "shop-platform"
version = "0.3.0"
description = "Shared building blocks for shop services: event contracts, Redis Streams messaging, HTTP clients, SQLite helpers."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.8",
    "httpx>=0.27",
    "redis>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.2", "fakeredis>=2.23", "ruff>=0.6"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
